[tool.poetry]
name = "financialagent"
version = "0.1.0"
description = "解析上市公司财务报告 PDF 并保存到数据库的智能代理系统"
authors = ["gg <874167199@qq.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
# 数据库
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
# PDF 处理
pymupdf = "^1.24.0"
pdfplumber = "^0.11.0"
# 数据验证
pydantic = "^2.0.0"
# LangGraph / LangChain
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"  # 如果使用 OpenAI
# 工具
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
# 测试
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
# 代码质量
black = "^24.0.0"
ruff = "^0.6.0"
# 类型检查
mypy = "^1.0.0"

[tool.poetry.scripts]
# 可以在这里定义命令行脚本，例如：
# financial-agent = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============ 工具配置 ============

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 默认排除
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 启用的规则
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行过长，由 black 处理
    "B008",  # 函数调用作为默认参数
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 暂时允许无类型注解
ignore_missing_imports = true   # 暂时忽略缺失的导入

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
